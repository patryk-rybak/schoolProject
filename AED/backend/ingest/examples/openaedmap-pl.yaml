# OpenAEDMap — krajowy eksport GeoJSON dla Polski.
#
# Największe i najbardziej aktualne maszynowe źródło pokrycia (18 298 punktów
# w snapshotcie 2026-11-21). Eksport zawiera wyłącznie węzły OSM.
# Licencja: ODbL 1.0, share-alike. Nie wolno zgubić atrybucji.
version: 1

source:
  id: openaedmap
  name: OpenAEDMap — eksport krajowy PL
  publisher: OpenAEDMap / OpenStreetMap contributors
  homepage_url: https://openaedmap.org/
  access_type: file
  reliability_tier: community
  license:
    id: ODbL-1.0
    url: https://opendatacommons.org/licenses/odbl/1-0/
    attribution: "© OpenStreetMap contributors"
    share_alike: true
  coverage:
    country: PL
    notes: Eksport tylko node; 2 waye z tagiem emergency=defibrillator nie trafiają do PL.geojson.
  update_frequency: continuous
  enabled: true
  notes: >
    Źródło bazowe P0. Brak statusu działania, adresy addr:* pokryte ok. 0,4%,
    check_date ok. 32,7%. Każdy rekord musi pozostać unverified/probable,
    nigdy confirmed bez weryfikacji terenowej.

connector:
  family: file_static
  parser: geojson
  notes: Pojedynczy duży plik GeoJSON; pobieranie warunkowe po ETag/Last-Modified.

fetch:
  url: https://openaedmap.org/api/v1/countries/PL.geojson
  method: GET
  timeout_ms: 120000
  retries:
    max: 2
    backoff_ms: 2000
  rate_limit:
    requests_per_minute: 6
  conditional:
    etag: true
    last_modified: true
  pagination:
    type: none
  user_agent: "AED-PL-ingest/0.1 (+https://example.org/aed; contact: data@example.org)"

parse:
  encoding: utf-8
  json:
    unwrap_string: false

records:
  path: /features
  identity:
    source_record_id:
      template: "{@osm_type}/{@osm_id}"
    dataset_id:
      const: "openaedmap:PL"
    stable: true
  dedupe:
    key:
      - field: "@osm_type"
      - field: "@osm_id"
    keep: last
    on_duplicate: warn

map:
  name:
    coalesce:
      - field: name
      - field: "defibrillator:location:pl"
      - field: "defibrillator:location"
      - field: operator
  facility_type:
    const: unknown
  lat:
    coord:
      from: geometry
      format: geojson
      pick: lat
      on_invalid: reject
  lon:
    coord:
      from: geometry
      format: geojson
      pick: lon
      on_invalid: reject
  coord_precision_m:
    const: 15
  country_code:
    const: PL
  city:
    field: "addr:city"
  street:
    field: "addr:street"
  house_number:
    field: "addr:housenumber"
  postcode:
    field: "addr:postcode"
  indoor:
    func: to_bool
    args:
      - field: indoor
  level:
    field: level
  room:
    field: room
  entrance_description:
    coalesce:
      - field: "defibrillator:location:pl"
      - field: "defibrillator:location"
  access_type:
    when:
      op: eq
      left:
        field: locked
      right: "yes"
    then: key
    else:
      map:
        value:
          field: access
        cases:
          "yes": public
          public: public
          permissive: permissive
          customers: customers
          private: private
          "no": private
        default: unknown
  opening_hours:
    field: opening_hours
  is_24_7:
    when:
      op: eq
      left:
        field: opening_hours
      right: "24/7"
    then: true
    else: null
  fee:
    func: to_bool
    args:
      - field: fee
  wheelchair_access:
    map:
      value:
        field: wheelchair
      cases:
        "yes": "yes"
        limited: limited
        "no": "no"
      default: unknown
  label:
    field: ref
  manufacturer:
    field: manufacturer
  model:
    field: model
  serial_number:
    field: serial_number
  device_type:
    const: public_aed
  status:
    const: unknown
  verification_status:
    when:
      op: lte
      left:
        func: date_age_days
        args:
          - field: check_date
          - builtin: fetched_at
      right: 365
    then: probable
    else: unverified
  confidence:
    const: 0.55
  last_verified_at:
    func: to_date
    args:
      - field: check_date
  operator_name:
    field: operator
  operator_type:
    map:
      value:
        field: "operator:type"
      cases:
        government: government
        public: government
        private: business
        ngo: ngo
      default: unknown
  phone:
    coalesce:
      - field: phone
      - field: "contact:phone"
  email:
    field: "contact:email"
  website:
    field: "contact:website"
  photo_url:
    field: image
  photo_license:
    field: "image:license"
  description:
    field: description
  note:
    field: note

validate:
  required:
    - name
    - lat
    - lon
  coords:
    bbox: [14.1, 49.0, 24.2, 54.9]
    on_invalid: reject
  enums: true
  on_error: reject

drift:
  baseline:
    record_count: 18298
    generated_at: "2026-11-21"
  schema:
    on_new_field: review
    on_missing_field: warn
    on_type_change: fail
    on_header_order_change: ignore
  volume:
    min_records: 10000
    max_delta_ratio: 0.5
    on_breach: review
  quality:
    max_coord_invalid_ratio: 0.01
    max_duplicate_id_ratio: 0.0
    max_null_ratio:
      name: 0.5
      lat: 0.0
      lon: 0.0
    on_breach: review
  axis:
    enabled: false
  golden_sample:
    size: 25
    required_match_ratio: 0.95
  actions:
    warn: log
    review: quarantine
    fail: disable

publish:
  enabled: true
  license_id: ODbL-1.0
  attribution: "© OpenStreetMap contributors"
  redact:
    - serial_number
  exports:
    - geojson
    - csv
