# Szablon źródła adresowego bez geometrii (klasa B/B-).
#
# Skopiuj plik, zmień source.id, URL, mapowanie kolumn i coverage. Ten szablon
# celowo nie mapuje lat/lon: rekord istnieje jako address_only, dopóki
# geokoder nie zwróci punktu z confidence >= 0.8. Nie twórz punktu z centroidu
# gminy ani z nazwy obiektu.
#
# Przykłady użycia:
# - HTML tabela z kolumnami: Obiekt, Adres, Miejscowość, Ulica, Numer
# - HTML lista, którą adapter normalizuje do wierszy
# - KML bez coordinates: zmień connector.family na google_my_maps_kml,
#   connector.parser na kml, a mapowanie pól na ExtendedData.
#
# Licencja: NOASSERTION oznacza brak zgody na publikację. Do czasu uzyskania
# licencji publish.enabled=false, a rekordy są widoczne tylko wewnętrznie.
version: 1

source:
  id: generic-address-list
  name: "Lista adresowa AED (szablon)"
  publisher: "Urząd gminy (uzupełnij)"
  homepage_url: https://example.org/aed-lista-adresowa
  access_type: html
  reliability_tier: official_local
  license:
    id: NOASSERTION
    attribution: "Urząd gminy (uzupełnij) - brak deklaracji licencji"
    share_alike: false
  coverage:
    country: PL
    teryt: ["0463011"]
    notes: >
      Zastąp TERYT gminy. Lista adresowa jest dowodem istnienia instytucji,
      nie dowodem konkretnego egzemplarza AED.
  update_frequency: unknown
  enabled: false
  notes: >
    Szablon dla 44 źródeł klasy B i 9 klasy B-. Domyślnie wyłączony, bo nie ma
    licencji ani potwierdzonego parsera. Włącz po dry-run i akceptacji prawnej.

connector:
  family: html_list
  parser: html_list
  notes: >
    Tabela lub lista HTML. Adapter normalizuje wiersze do pól o nazwach z map.
    Dla PDF/DOCX użyj transkrypcji do CSV i rodziny file_static.

fetch:
  url: https://example.org/aed-lista-adresowa
  method: GET
  timeout_ms: 30000
  retries:
    max: 2
    backoff_ms: 1500
  rate_limit:
    requests_per_minute: 12
  conditional:
    etag: true
    last_modified: true
  pagination:
    type: none
  user_agent: "AED-PL-ingest/0.1 (+https://example.org/aed; contact: data@example.org)"

parse:
  encoding: utf-8
  trim_headers: true
  json:
    unwrap_string: false

records:
  path: "$"
  identity:
    source_record_id:
      template: "{source_id}:{row_index}"
      vars:
        source_id:
          builtin: source_id
        row_index:
          builtin: row_index
    dataset_id:
      const: "generic-address-list:snapshot"
    stable: false
  dedupe:
    key:
      - field: Adres
      - field: Obiekt
    keep: last
    on_duplicate: warn

map:
  name:
    coalesce:
      - field: Obiekt
      - field: Nazwa
  facility_type:
    const: unknown
  # Brak lat/lon jest celowy. To rekord address_only.
  country_code:
    const: PL
  voivodeship:
    field: Województwo
  county:
    field: Powiat
  commune:
    field: Gmina
  city:
    field: Miejscowość
  street:
    field: Ulica
  house_number:
    field: Numer
  postcode:
    field: Kod pocztowy
  address_text:
    coalesce:
      - field: Adres
      - field: address_text
  address_kind:
    const: building
  address_source:
    const: source
  address_confidence:
    const: 0.6
  location_status:
    const: address_only
  geom_source:
    const: none
  access_type:
    const: unknown
  device_type:
    const: public_aed
  status:
    const: unknown
  verification_status:
    const: candidate
  confidence:
    const: 0.35
  operator_name:
    coalesce:
      - field: Instytucja
      - field: Operator
  operator_type:
    const: unknown

validate:
  required:
    - name
    - address_text
  require_location: address_or_point
  coords:
    bbox: [14.1, 49.0, 24.2, 54.9]
    on_invalid: review
    on_missing: review
  enums: true
  on_error: review

geocoding:
  enabled: true
  strategy: structured_first
  provider_order: [prg, uug, nominatim]
  address_template: "{street} {house_number}, {postcode} {city}, {commune}, PL"
  required_components: [city]
  min_confidence: 0.8
  precision_m:
    building: 50
    street: 200
    locality: 1000
  on_failure: address_only
  cache_ttl_days: 180
  refresh_after_days: 365
  rate_limit:
    requests_per_minute: 30
  verification:
    cross_check_source_id: openaedmap
    max_distance_m: 150
    promote_verification: never

drift:
  baseline:
    record_count: null
    generated_at: "2026-11-21"
    schema_fields:
      - Obiekt
      - Adres
      - Miejscowość
      - Ulica
      - Numer
  schema:
    on_new_field: review
    on_missing_field: review
    on_type_change: review
    on_header_order_change: review
  volume:
    min_records: 1
    max_delta_ratio: 0.5
    on_breach: review
  quality:
    max_coord_invalid_ratio: 1.0
    max_duplicate_id_ratio: 0.0
    max_null_ratio:
      name: 0.0
      address_text: 0.0
      lat: 1.0
      lon: 1.0
    on_breach: review
  axis:
    enabled: false
  golden_sample:
    size: 5
    required_match_ratio: 0.8
  actions:
    warn: log
    review: quarantine
    fail: disable

publish:
  enabled: false
  license_id: NOASSERTION
  attribution: "Urząd gminy (uzupełnij) - brak deklaracji licencji"
  redact:
    - phone
    - email
  exports: []
